<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="JianyingCraft">
  <!-- JianyingCraft 自有图标（原创）：渐变圆角方 + 三段竖条与时间轴基线。
       几何与 assets/brand/jianyingcraft-1024.png 一致，由 target/make-icon.py 生成 PNG。 -->
  <defs>
    <linearGradient id="jc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#7C5CFF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#jc)"/>
  <g fill="#0C0E12">
    <rect x="300" y="592" width="96" height="168" rx="28"/>
    <rect x="464" y="300" width="96" height="460" rx="28"/>
    <rect x="628" y="452" width="96" height="308" rx="28"/>
    <rect x="300" y="800" width="424" height="36" rx="18"/>
  </g>
</svg>
